<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- "podking" mark: three audio-equalizer bars topped with three crown peaks.
       Pod = audio waveform; King = crown. Reads at 16px. -->
  <rect width="32" height="32" rx="6" fill="#1a1814"/>

  <!-- Three crown peaks -->
  <path
    d="M7.5 10.5 L9.75 6 L12 10.5"
    stroke="#fbf7ee" stroke-width="1.6"
    stroke-linejoin="round" stroke-linecap="round"
  />
  <path
    d="M13.75 10.5 L16 4 L18.25 10.5"
    stroke="#fbf7ee" stroke-width="1.6"
    stroke-linejoin="round" stroke-linecap="round"
  />
  <path
    d="M20 10.5 L22.25 6 L24.5 10.5"
    stroke="#fbf7ee" stroke-width="1.6"
    stroke-linejoin="round" stroke-linecap="round"
  />

  <!-- Three vertical bars -->
  <rect x="8.5"   y="12" width="2.5" height="13" rx="1.25" fill="#fbf7ee"/>
  <rect x="14.75" y="12" width="2.5" height="16" rx="1.25" fill="#fbf7ee"/>
  <rect x="21"    y="12" width="2.5" height="13" rx="1.25" fill="#fbf7ee"/>
</svg>
